aid: shipping
name: Shipping.com
description: >-
  Shipping.com is a shipping intelligence and marketplace platform that provides
  inside information on the best deals across the shipping industry worldwide. The
  platform enables carriers, shippers, and third-party logistics companies (3PLs)
  to access reduced shipping rates, improve revenue opportunities, and optimize
  transportation supply chain operations. Shipping.com is headquartered in New York City
  and connects members of the transportation and logistics industry with competitive
  pricing and market intelligence.
